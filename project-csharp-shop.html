<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Sharp shop, winkel in C-Sharp door Rafael Larosse</title>
    <meta name="description" content="Mijn project C# shop: een winkel als consoleapplicatie in C#. Bekijk wat ik maakte.">

    <link rel="stylesheet" href="css/tailwind.css">

</head>

<body class="p-4">

    <header class="relative overflow-hidden border-4 border-[#0B6E4F] mb-4 min-h-24 md:min-h-32">
        <img src="./images/sfeerblad.png" alt="" class="absolute inset-0 w-full h-full object-cover object-center">
        <div class="absolute inset-0 bg-black/60"></div>

        <div class="relative flex flex-wrap items-center justify-between gap-3 px-4 py-3 md:px-8 md:py-4">
            <a href="index.html"><img src="./images/logo.png" alt="logo project, naar de startpagina" class="h-12 md:h-16 w-auto"></a>


            <input type="checkbox" id="menu-knop" class="peer sr-only">
            <label for="menu-knop" class="cursor-pointer border border-gray-200 px-3 py-2 text-white hover:border-[#D4713A] hover:text-[#D4713A] peer-focus-visible:outline-3 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-[#D4713A] md:hidden">Menu</label>

            <nav aria-label="Hoofdmenu" class="hidden w-full peer-checked:block md:block md:w-auto">
                <ul class="flex flex-col gap-1 text-lg md:flex-row md:gap-x-10 md:text-2xl">

                    <li><a href="index.html" class="block py-1 text-gray-200 hover:text-[#D4713A]">Home</a></li>
                    <li><a href="portfolio.html" class="block py-1 text-gray-200 hover:text-[#D4713A]">Portfolio</a></li>
                    <li><a href="#" aria-current="page" class="block py-1 underline text-white hover:text-[#D4713A]">C# project</a></li>

                    <li><a href="contact.html" class="block py-1 text-gray-200 hover:text-[#D4713A]">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="grid grid-cols-1 gap-4 mb-4 lg:grid-cols-3">

        <main class="border border-[#0B6E4F] p-4 lg:col-span-2">

            <h1 class="text-3xl font-bold mb-2 text-[#0B6E4F]">Project C# Shop</h1>

            <div class="border border-[#C9B896] mb-4">
                <img src="./images/csharp-image.png" alt="C# code van het FISHR Clothing logo als ASCII-art" class="zoom-img block w-full h-auto cursor-zoom-in">
            </div>

            <h2 class="text-xl font-bold mb-2 text-[#0B6E4F]">Beschrijving</h2>
            <p class="mb-4">In deze project heb ik een terminal shop gemaakt in C-Sharp</p>

            <h2 class="text-xl font-bold mb-2 text-[#0B6E4F]">Galerij</h2>
            <div class="grid grid-cols-3 items-start gap-4 mb-2">
                <div class="border border-[#C9B896]">
                    <img src="./images/csharpimg1.png" alt="Screenshot 1 van de C# shop" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>
                <div class="border border-[#C9B896]">
                    <img src="./images/csharpimg2.png" alt="Screenshot 2 van de C# shop" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>
                <div class="border border-[#C9B896]">
                    <img src="./images/csharpimg3.png" alt="Screenshot 3 van de C# shop" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>

                <div class="extra hidden border border-[#C9B896]">
                    <img src="./images/csharpimg4.png" alt="Screenshot 4 van de C# shop" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>
                <div class="extra hidden border border-[#C9B896]">
                    <img src="./images/csharpimg5.png" alt="Screenshot 5 van de C# shop" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>
                <div class="extra hidden border border-[#C9B896]">
                    <img src="./images/csharpimg6.png" alt="Screenshot 6 van de C# shop" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>
                <div class="extra hidden border border-[#C9B896]">
                    <img src="./images/csharp-code.png" alt="Screenshot van de C# code" class="zoom-img block w-full h-auto cursor-zoom-in">
                </div>
            </div>

            <button id="meer" type="button" aria-label="Toon meer afbeeldingen"
                class="block mx-auto mb-4 bg-[#0B6E4F] text-white px-3 py-1 hover:bg-[#D4713A] cursor-pointer">&#9660;</button>

            <a href="portfolio.html" class="inline-block border border-[#0B6E4F] bg-[#0B6E4F] text-white px-2 py-1 hover:bg-[#D4713A] hover:border-[#D4713A]">
                &larr; Terug naar portfolio
            </a>

        </main>

        <aside class="border border-[#0B6E4F] bg-[#C9B896]/30 p-4">
            <h2 class="text-xl font-bold mb-2 text-[#0B6E4F]">Projectinfo</h2>
            <p class="mb-4">Schoolopdracht, 2025.</p>

            <h2 class="text-xl font-bold mb-2 text-[#0B6E4F]">Technologieën</h2>
            <ul class="mb-4">
                <li>C#</li>
            </ul>
        </aside>

    </div>

    <footer class="border border-[#0B6E4F] bg-[#C9B896]/30 p-4">
        <p class="mb-2">&copy; 2026 Rafael Larosse</p>
    </footer>

    <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/90 items-center justify-center cursor-zoom-out">
        <img id="groot" src="" alt="" class="max-w-[85vw] max-h-[85vh]">
    </div>

    <script>
        const fotos = document.querySelectorAll('.zoom-img');
        const lightbox = document.getElementById('lightbox');
        const groot = document.getElementById('groot');

        function open(foto) {
            groot.src = foto.src;
            groot.alt = foto.alt;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        function sluit() {
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        }


        fotos.forEach(foto => foto.addEventListener('click', () => open(foto)));

        lightbox.addEventListener('click', sluit);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') sluit(); });

        const knop = document.getElementById('meer');
        knop.addEventListener('click', () => {
            document.querySelectorAll('.extra').forEach(el => el.classList.toggle('hidden'));
            knop.innerHTML = knop.innerHTML.trim() === '▼' ? '&#9650;' : '&#9660;';
        });
    </script>
</body>
</html>
